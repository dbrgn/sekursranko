[package]
name = "sekursranko"
description = "An efficient and memory-safe Threema Safe server implementation written in Rust"
version = "0.5.5"
authors = ["Danilo Bargen <mail@dbrgn.ch>"]
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["std", "help", "usage", "error-context", "derive", "cargo"], default-features = false }
env_logger = "0.11"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros",  "fs", "io-util", "net", "time"] }
toml = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
